# PocketBoard-Corne-HW1 configuration

# Right half MCP23017 on I2C.
CONFIG_I2C=y
CONFIG_GPIO_MCP230XX=y

# MCP23017 rows are not wired to its INT pins in HW1, so use polling.
# This also keeps both matrix scanners using the same reliable scan mode.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# Give the MCP23017/I2C side time to settle before sampling rows.
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=1
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=1

# Diagnostic v5: USB CDC logging. Remove after diagnosis.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000
CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_GPIO_LOG_LEVEL_DBG=y

# v5.1: CONFIG_ZMK_LOG_LEVEL removed because ZMK 3.5 marks it as non-user-configurable.
