# PocketBoard-Corne-HW1 v10
# Functional firmware after wiring MCP23017 address pins A0/A1/A2 to GND.

CONFIG_I2C=y
CONFIG_GPIO_MCP230XX=y

# HW1 uses polling; MCP INT pins are not wired.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=1
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=1
